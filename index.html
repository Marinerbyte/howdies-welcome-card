<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yasin's Tagda Card</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        .card-wrapper {
            width: 300px;
            height: 400px;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            padding: 10px;
            background-color: #ffe6e6;
            color: #333;
            border: 2px solid #000;
        }
        .param {
            font-size: 14px;
            margin: 5px 0;
            text-align: center;
            width: 100%;
        }
        .param label {
            font-weight: bold;
            color: #a10000;
        }
        .avatar-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin: 10px 0;
            box-shadow: 0 0 12px #f00;
        }
        .username {
            font-size: 18px;
            font-weight: bold;
            color: #a10000;
            animation: typing 2s steps(10, end);
        }
        .crown {
            font-size: 28px;
            color: #ffd700;
            margin: 5px 0;
        }
        .greeting {
            font-size: 12px;
            color: #a10000;
        }
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }
    </style>
</head>
<body>
    <!-- Red card for Yasin, new repo, May 20 2025 -->
    <div class="card-wrapper">
        <div class="param"><span class="username" id="username">Loading...</span></div>
        <div class="crown">👑 Owner</div>
        <div class="greeting">Yasin's the boss!</div>
        <div class="param"><label>Avatar:</label> <img class="avatar-preview" id="avatar" src="" alt="Avatar"></div>
        <div class="param"><label>Avatar Debug:</label> <span id="avatarDebug">Loading...</span></div>
        <div class="param"><label>Membership:</label> <span id="membershipLevel">Loading...</span></div>
        <div class="param"><label>Last Login:</label> <span id="lastLogin">Loading...</span></div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const username = decodeURIComponent(params.get('username') || 'Guest');
        const avatar = decodeURIComponent(params.get('avatar') || '');
        const membershipLevel = decodeURIComponent(params.get('membershipLevel') || 'none');
        const lastLogin = decodeURIComponent(params.get('lastLogin') || 'none');

        document.getElementById('username').textContent = username !== '$username$' && username.trim() !== '' ? username : 'Guest';

        const avatarElement = document.getElementById('avatar');
        const defaultAvatar = 'https://robohash.org/guest.png?size=80x80';
        const avatarDebug = document.getElementById('avatarDebug');
        avatarElement.src = avatar && avatar !== '$avatar$' && avatar.trim() !== '' ? avatar : defaultAvatar;
        avatarElement.onerror = () => {
            avatarElement.src = defaultAvatar;
            avatarDebug.textContent = 'Used default: Invalid avatar URL';
        };
        avatarDebug.textContent = avatar ? `Raw: ${avatar}` : 'No avatar URL';

        document.getElementById('membershipLevel').textContent = membershipLevel !== '$membershipLevel$' && membershipLevel.trim() !== '' ? membershipLevel : 'none';
        document.getElementById('lastLogin').textContent = lastLogin !== '$lastLogin$' && lastLogin.trim() !== '' ? lastLogin : 'none';
    </script>
</body>
</html>
