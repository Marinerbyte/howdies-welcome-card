<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Card</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        .card-wrapper {
            width: 300px;
            height: 400px;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            padding: 10px;
            background-color: #e6f3ff;
            color: #333;
            border: 2px solid #000;
        }
        .param {
            font-size: 14px;
            margin: 5px 0;
            text-align: center;
            width: 100%;
        }
        .param label {
            font-weight: bold;
            color: #004080;
        }
        .user-id {
            font-size: 18px;
            font-weight: bold;
            color: #004080;
            animation: slideIn 1s ease-in;
        }
        .role-badge {
            font-size: 16px;
            margin: 5px 0;
            color: #004080;
        }
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-left: 5px;
            animation: pulse 2s infinite;
        }
        .status-online {
            background-color: #00cc00;
        }
        .status-offline {
            background-color: #999;
        }
        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <!-- Blue status card, general, new params, May 20 2025 -->
    <div class="card-wrapper">
        <div class="param"><span class="user-id" id="userId">Loading...</span></div>
        <div class="role-badge" id="roleBadge">Loading...</div>
        <div class="param"><label>Role:</label> <span id="role">Loading...</span></div>
        <div class="param"><label>Join Date:</label> <span id="joinDate">Loading...</span></div>
        <div class="param"><label>Status:</label> <span id="status">Loading...</span><span class="status-indicator" id="statusIndicator"></span></div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const userId = decodeURIComponent(params.get('userId') || 'Unknown');
        const role = decodeURIComponent(params.get('role') || 'Member');
        const joinDate = decodeURIComponent(params.get('joinDate') || 'N/A');
        const status = decodeURIComponent(params.get('status') || 'Offline');

        document.getElementById('userId').textContent = userId !== '$userId$' && userId.trim() !== '' ? userId : 'Unknown';

        const roleElement = document.getElementById('role');
        const roleBadge = document.getElementById('roleBadge');
        const validRole = role !== '$role$' && role.trim() !== '' ? role : 'Member';
        roleElement.textContent = validRole;
        roleBadge.textContent = validRole === 'Admin' ? '🛡️ Admin' : validRole === 'Moderator' ? '⭐ Moderator' : '👤 Member';

        const joinDateElement = document.getElementById('joinDate');
        joinDateElement.textContent = joinDate !== '$joinDate$' && joinDate.trim() !== '' ? joinDate : 'N/A';

        const statusElement = document.getElementById('status');
        const statusIndicator = document.getElementById('statusIndicator');
        const validStatus = status !== '$status$' && status.trim() !== '' ? status : 'Offline';
        statusElement.textContent = validStatus;
        statusIndicator.className = 'status-indicator ' + (validStatus.toLowerCase() === 'online' ? 'status-online' : 'status-offline');
    </script>
</body>
</html>
